name: Claude Conflict Resolve

# develop向けPRがdevelopとの間でコンフリクトした際、Claude Codeが解消を試みる
# ワークフローの、本リポジトリ側のトリガー定義。
#
# ジョブ本体は持たず、issue-deckの再利用可能ワークフローを参照する
# (guchi-apps/issue-deck#1066・#1090)。入力の意味はclaude-ci-fix.ymlのコメントを参照
# (同じ設計・同じ値)。
#
# 参照はタグ固定にする。@developを参照するとissue-deck側の不具合が即座に波及するため。
#
# トリガー(`on:`)はジョブ本体と違って各リポジトリのcallerが持つコピーなので、issue-deck側で
# 直しても波及しない。issue-deck側のトリガーを変えたときはこのファイルも合わせて直す
# (guchi-apps/issue-deck#1366)。
#
# トリガー:
# - workflow_run(CI / requested / develop): developへ新たな変更が入るとOPENなPRが
#   コンフリクトしうるため、その都度検知する(最も速報性が高い経路)。
#   本来はpush(develop)で直接受けたいが、claude-code-actionはpushイベントに対応して
#   おらず`Unsupported event type: push`で必ず失敗する(guchi-apps/issue-deck#1330。
#   対応するのはissues / issue_comment / pull_request / pull_request_target /
#   pull_request_review / pull_request_review_comment / workflow_dispatch /
#   repository_dispatch / schedule / workflow_runの10種類のみ)。このリポジトリの
#   ci.ymlがpush(develop)で走るため、その`requested`(=CI実行がキューされた時点)を
#   代理のpush通知として使う。completedではなくrequestedにするのは、CIの完走を待つ分だけ
#   検知が遅れるのを避けるためで、コンフリクト検知自体はCIの成否と無関係なため待つ必要がない。
#   なお workflow_run は「デフォルトブランチ上のワークフローファイル」でのみ発火する。
#   このリポジトリのデフォルトブランチはdevelopなので、developへマージした時点で有効。
#   仮に発火しなくても後述のschedule(15分おき)が拾うため、取りこぼしても検知は止まらない。
# - pull_request(develop向け、opened/reopened): develop向けPRが作成された時点で
#   既にdevelopとコンフリクトしているケースを即座に拾うため。
# - schedule(15分おき): 上2つの直後はGitHubのmergeable判定が終わっておらずUNKNOWNの
#   ままの場合があるため、取りこぼしを拾い直す安全網。
# - workflow_dispatch: 手動実行と、issue-deckの画面の「コンフリクトを自動解消」ボタン。
#   issue_numberを渡すとそのIssueのdevelop向けPR1件だけを対象にする。

on:
  workflow_run:
    workflows:
      - CI
    types:
      - requested
    branches:
      - develop
  pull_request:
    types:
      - opened
      - reopened
    branches:
      - develop
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "対象のIssue番号（未指定ならdevelop向けの全OPEN PRを走査する）"
        required: false
        type: string

jobs:
  conflict-resolve:
    uses: guchi-apps/issue-deck/.github/workflows/reusable-claude-conflict-resolve.yml@workflows/v44
    with:
      runtime-setup: node-db
      package-manager: pnpm
      node-version: "24"
      # 再利用ワークフロー内のinputsコンテキストはworkflow_callのinputsを指すため、
      # 本ワークフローのworkflow_dispatch入力はここで明示的に渡す。
      issue-number: ${{ inputs.issue_number }}
      # プロンプトの「- 解消後、」に続けてそのまま埋め込まれるため、文末まで含めて1行で書く。
      verify-commands: "`pnpm test`（lint・typecheck・node --testの回帰テストを実行）と `pnpm build:ci` を実行し、問題がないことを確認する（DBサーバーは実際には起動していないが、環境変数はこのステップに既に設定済みのため`.github/workflows/ci.yml`のbuildステップと同様に成功するはず）"
      build-env: |
        DATABASE_URL=mysql://placeholder:placeholder@127.0.0.1:3306/app_dayspan
        NEXT_PUBLIC_SUPABASE_URL=https://ci-placeholder.supabase.co
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=ci-placeholder
      # 上の uses: と同じタグを指定する。
      prompts-ref: workflows/v44
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write

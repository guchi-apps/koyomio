name: Claude CI Fix

# develop向けPR(issue-<番号>ブランチ)のCI(.github/workflows/ci.yml)が失敗した際、
# Claude Codeが原因を修正してpushするワークフローの、本リポジトリ側のトリガー定義。
#
# ジョブ本体は持たず、issue-deckの再利用可能ワークフローを参照する
# (guchi-apps/issue-deck#1066・#1090)。従来はワークフローをコピーして持っていたが、
# issue-deck側の改善を手でバックポートし続ける運用が対象リポジトリの増加に耐えないため、
# 本体をissue-deckへ集約する方式へ移行した。
#
# 本リポジトリ固有の差異はwith:で吸収する。
#   runtime-setup: node-db     Next.js + Prisma + MariaDB
#   package-manager: pnpm      inputsの既定は多数派のnpmのため明示する
#   node-version: "24"         ci.ymlと揃え、pnpm build:ciの結果がCIと食い違わないようにする
#   build-env                  pnpm build:ciの実行に必要なCI専用プレースホルダー。
#                              実シークレットは書かない(secrets: inheritで別途渡る)
#   prompts-ref                プロンプトはissue-deck側のものを使う。指定しないと本リポジトリの
#                              .github/prompts/が読まれ、存在しないため落ちる。uses:と同じタグにすること
#
# 参照はタグ固定にする。@developを参照するとissue-deck側の不具合が即座に波及するため。
# issue-deck自身だけがローカルパス参照で常に最新を使い、カナリアとして先に問題を検知する。

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      issue_number:
        description: "対象のIssue番号（develop向けPRのissue-<番号>ブランチのIssue番号）"
        required: true
        type: number

jobs:
  ci-fix:
    uses: guchi-apps/issue-deck/.github/workflows/reusable-claude-ci-fix.yml@workflows/v44
    with:
      runtime-setup: node-db
      package-manager: pnpm
      node-version: "24"
      # 再利用ワークフロー内のinputsコンテキストはworkflow_callのinputsを指すため、
      # 本ワークフローのworkflow_dispatch入力はここで明示的に渡す。
      issue-number: ${{ inputs.issue_number }}
      # プロンプトの「- 修正後、」に続けてそのまま埋め込まれるため、文末まで含めて1行で書く。
      verify-commands: "`pnpm test`（lint・typecheck・node --testの回帰テストを実行）と `pnpm build:ci` を実行し、いずれも問題がないことを確認する（DBサーバーは実際には起動していないが、環境変数はこのステップに既に設定済みのため`.github/workflows/ci.yml`のbuildステップと同様に成功するはず）"
      build-env: |
        DATABASE_URL=mysql://placeholder:placeholder@127.0.0.1:3306/app_dayspan
        NEXT_PUBLIC_SUPABASE_URL=https://ci-placeholder.supabase.co
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=ci-placeholder
      # 上の uses: と同じタグを指定する。片方だけ上げると新しいワークフローで
      # 古いプロンプトが使われる。
      prompts-ref: workflows/v44
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write

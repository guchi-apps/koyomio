name: CI

# 注意: claude-conflict-resolve.ymlが、このワークフローの`workflow_run`(CI / requested /
# develop)を「developへのpush」の代理通知として購読している(guchi-apps/issue-deck#1330。
# claude-code-actionがpushイベントに対応していないため直接pushで受けられない)。したがって
# - ワークフロー名(`CI`)
# - `push: branches: [develop]`トリガー
# を変更・削除すると、コンフリクト自動解消の最速検知経路が無言で止まる(scheduleの15分
# おきの安全網だけが残る)。変更する場合はclaude-conflict-resolve.ymlも合わせて直す。

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:unit

      - name: iOS配信スクリプトのテスト
        run: node --test ios/scripts/*.test.mjs

      - name: Build
        run: pnpm build:ci
        env:
          NODE_ENV: production
          DATABASE_URL: mysql://placeholder:placeholder@127.0.0.1:3306/app_dayspan
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  # マニフェストの repo 項目が、GitHub側から実際に値として届いているかを確かめる（#476）。
  #
  # 同じ確認は deploy.yml にもあるが、あちらが動くのは main へマージしたあと——
  # 値が無いままリリースされ、本番の .env へ空文字が書かれたあとにしか気付けない。
  # マニフェストへ項目を足すのは develop 向けのPRなので、そこで止める。
  # 実際にVAPID鍵（#359・#400）とTRAINROUTE_TOKEN（#476）が、1Passwordには入って
  # いるのにGitHubへ同期されないまま、それぞれリリースをまたいで残っていた。
  # 手順は docs/setup-checklist.md に書かれていたが、実行したかを確かめる者がいなければ
  # 同じ抜けが起きる（.github/scripts/check-repo-secrets.sh 冒頭の断り書きと同じ理由）。
  #
  # deploy側は警告だけでデプロイを続ける（値が無くても他の機能は動くため）。
  # こちらは落とす。マージ前なら、同期してから再実行するだけで済む。
  secrets-check:
    runs-on: ubuntu-latest

    # マニフェストの repo 項目をすべて並べる。並べ忘れた項目はスクリプトが
    # undeclared として報告する（判定できないまま黙って通さない）。
    # このブロックは scripts/generate-workflow-env-block.sh で生成する。
    env:
      TARGET_DIR: ${{ secrets.TARGET_DIR }}
      DB_NAME: ${{ secrets.DB_NAME }}
      GOOGLE_CALENDAR_CLIENT_ID: ${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}
      TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
      OPS_API_TOKEN: ${{ secrets.OPS_API_TOKEN }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      SHARED_TOKEN_API_SECRET: ${{ secrets.SHARED_TOKEN_API_SECRET }}
      ISSUE_DECK_URL: ${{ vars.APP_BASE_URL }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
      APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
      APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: マニフェストのrepo項目が届いているか確かめる
        id: check
        run: bash .github/scripts/check-repo-secrets.sh

      - name: 届いていない値があれば落とす
        if: steps.check.outputs.missing != '' || steps.check.outputs.undeclared != ''
        # 値そのものは出さない。名前だけでどこを直せばよいか決まる。
        env:
          MISSING: ${{ steps.check.outputs.missing }}
          UNDECLARED: ${{ steps.check.outputs.undeclared }}
        run: |
          # repo項目が1件残らず空なら、「1件足りない」ではなく「このrunへ
          # repository secretが渡っていない」。forkからのPRとDependabotがこれに当たり、
          # 落としてもPRの側では直せない。deploy側の警告が引き続き受け持つ。
          total=$(awk -F'\t' '$1 !~ /^#/ && $1 != "" && $2 == "repo" { n++ } END { print n+0 }' .github/secrets-manifest.tsv)
          missing_count=$(printf '%s' "$MISSING" | wc -w)
          if [ -z "$UNDECLARED" ] && [ "$total" -gt 0 ] && [ "$missing_count" -eq "$total" ]; then
            echo "::notice::このrunへrepository secretが渡っていません（forkからのPR・Dependabot）。確認を飛ばします"
            exit 0
          fi

          if [ -n "$MISSING" ]; then
            echo "::error::GitHub Secretsが空です: $MISSING"
            echo "1Passwordへ入れたうえで 'gh workflow run sync-secrets.yml -f only=<KEY>' を実行し、gh secret list に並ぶことを確かめてください（docs/setup-checklist.md）"
          fi
          if [ -n "$UNDECLARED" ]; then
            echo "::error::マニフェストにあるのに、このジョブのenvへ並んでいません: $UNDECLARED"
            echo "ci.yml と deploy.yml の secrets-check ジョブの env へ足してください（scripts/generate-workflow-env-block.sh で生成できます）"
          fi
          exit 1

  notify:
    needs: [lint-and-build, secrets-check]
    if: always()
    runs-on: ubuntu-latest

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んで
    # いたが、サービスアカウントの日次レート制限を使い切ってフリート全体の
    # デプロイが止まった（guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_*・
    # SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine workflow status
        id: status
        # needsの結果は`needs['secrets-check']`で読む。式の中では`-`を含む名前を
        # ドットで辿れない（`needs.secrets-check`は構文エラーになる）。
        env:
          LINT_AND_BUILD: ${{ needs.lint-and-build.result }}
          SECRETS_CHECK: ${{ needs['secrets-check'].result }}
        run: |
          result=success
          jobs=""
          for entry in "lint-and-build:$LINT_AND_BUILD" "secrets-check:$SECRETS_CHECK"; do
            name="${entry%%:*}"
            state="${entry#*:}"
            if [ "$state" = "success" ]; then
              continue
            fi
            jobs="${jobs:+$jobs, }$name: $state"
            if [ "$state" = "cancelled" ] && [ "$result" != "failure" ]; then
              result=cancelled
            else
              result=failure
            fi
          done
          if [ -z "$jobs" ]; then
            jobs="lint-and-build, secrets-check"
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          # develop push: failure only. main PR: success, failure, and cancelled.
          if [ "$result" = "failure" ]; then
            echo "should_notify=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.base_ref }}" = "main" ]; then
            echo "should_notify=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_notify=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Signaly に通知
        if: steps.status.outputs.should_notify == 'true'
        # 通知はCIやデプロイの合否そのものではない。ここが失敗してもrun全体を
        # 落とさない（guchi-apps/issue-deck#1302）。
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_APP: dayspan
          NOTIFY_KIND: CI
          NOTIFY_STATUS: ${{ steps.status.outputs.result }}
          NOTIFY_JOB: ${{ steps.status.outputs.jobs }}
        run: bash .github/scripts/signaly-notify.sh
